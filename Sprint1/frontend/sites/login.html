<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="../res/img/tickets.ico">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
        <title>Eventzone</title>
        <link rel="stylesheet" href="../res/css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="../res/css/styles.css">
    </head>
    <body class="min-vh-100 d-flex flex-column">
        <!-- Add Navigation -->
        <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #4f694d;">
            <div class="container">
                <!-- Logo and Brand/Welcome -->
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="../res/img/logo.png" alt="Logo" height="40" class="me-2">
                    <span id="welcome-message" class="text-dark">Eventzone</span>
                </a>

                <!-- Mobile DropDown -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" 
                        aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navbar Content -->
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="login.html">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="register.html">Register</a>
                        </li>
                        <li class="nav-item">
                            <button id="logout-btn" class="nav-link text-dark btn btn-link" 
                                    onclick="logout()" style="display: none;">
                                Logout
                            </button>
                        </li>
                    </ul>

                    <!-- Search Form -->
                    <form class="d-flex me-3">
                        <div class="input-group">
                            <input class="form-control" type="search" placeholder="Search..." aria-label="Search">
                            <button class="btn btn-outline-dark" type="submit">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Cart Icon -->
                    <div class="d-flex align-items-center">
                        <a href="#" class="text-dark position-relative">
                            <img src="../res/img/cart.png" alt="Cart" height="30">
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                0
                                <span class="visually-hidden">items in cart</span>
                            </span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow-1 d-flex align-items-center py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                        <div class="card shadow">
                            <div class="card-body p-4 p-sm-5">
                                <h2 class="card-title text-center mb-4">Login</h2>
                                <div id="login-error" class="alert alert-danger d-none"></div>
                                <form id="login-form">
                                    <div class="mb-3">
                                        <label for="username" class="form-label">Username:</label>
                                        <input type="text" id="username" name="username" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password:</label>
                                        <input type="password" id="password" name="passwordh" class="form-control" required>
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                                        <label class="form-check-label" for="rememberMe">Remember me</label>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-primary">Login</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="py-3 bg-light">
            <div class="container text-center">
                <p class="mb-0">&copy; 2025 Eventzone. All rights reserved.</p>
            </div>
        </footer>

        <script src="../js/login.js"></script>
        <script src="../js/auth.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                checkLoginStatus();
            });
        </script>
    </body>
</html>
