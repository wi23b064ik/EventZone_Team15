<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="img/tickets.ico">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
        <title>Register - Eventzone</title>
        <link rel="stylesheet" href="../res/css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </head>
    <body class="min-vh-100 d-flex flex-column">
        <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #4f694d;">
            <div class="container">
                <!-- Logo and Brand/Welcome -->
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="../res/img/logo.png" alt="Logo" height="40" class="me-2">
                    <span id="welcome-message" class="text-dark">Eventzone</span>
                </a>

                <!-- Mobile DropDown -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" 
                        aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navbar -->
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="login.html">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="register.html">Register</a>
                        </li>
                        <li class="nav-item">
                            <button id="logout-btn" class="nav-link text-dark btn btn-link" 
                                    onclick="logout()" style="display: none;">
                                Logout
                            </button>
                        </li>
                    </ul>
                    
                    <!-- Search Form -->
                    <form class="d-flex me-3">
                        <div class="input-group">
                            <input class="form-control" type="search" placeholder="Search..." aria-label="Search">
                            <button class="btn btn-outline-dark" type="submit">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Cart Icon -->
                    <div class="d-flex align-items-center">
                        <a href="#" class="text-dark position-relative">
                            <img src="../res/img/cart.png" alt="Cart" height="30">
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                0
                                <span class="visually-hidden">items in cart</span>
                            </span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
        <main class="flex-grow-1 py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-xl-10">
                        <div class="card shadow">
                            <div class="card-body p-4 p-sm-5">
                                <h2 class="card-title mb-4">Registration Form</h2>
                                <div id="register-error" class="alert alert-danger d-none"></div>
                                
                                <form id="register-form" class="needs-validation" novalidate>
                                    <div class="row">
                                        <!-- Left Column -->
                                        <div class="col-md-6 pe-md-4">
                                            <h5 class="mb-3">Account Information</h5>
                                            <div class="mb-3">
                                                <label for="username" class="form-label">Username*</label>
                                                <input type="text" class="form-control" id="username" name="username" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="email" class="form-label">Email*</label>
                                                <input type="email" class="form-control" id="email" name="email" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="password" class="form-label">Password*</label>
                                                <input type="password" class="form-control" id="password" name="passwordh" required minlength="6">
                                            </div>
                                            <div class="mb-3">
                                                <label for="confirm-password" class="form-label">Confirm Password*</label>
                                                <input type="password" class="form-control" id="confirm-password" name="confirm-password" required minlength="6">
                                            </div>
                                            <div class="mb-3">
                                                <label for="payment" class="form-label">Payment Information</label>
                                                <textarea class="form-control" id="payment" name="paymentInfo" rows="3"></textarea>
                                            </div>
                                        </div>

                                        <!-- Right Column -->
                                        <div class="col-md-6 ps-md-4">
                                            <h5 class="mb-3">Personal Information</h5>
                                            <div class="mb-3">
                                                <label for="salutation" class="form-label">Salutation</label>
                                                <select class="form-select" id="salutation" name="salutation">
                                                    <option value="">None</option>
                                                    <option value="Mr">Mr</option>
                                                    <option value="Mrs">Mrs</option>
                                                    <option value="Ms">Ms</option>
                                                    <option value="Dr">Dr</option>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <label for="firstname" class="form-label">First Name*</label>
                                                <input type="text" class="form-control" id="firstname" name="firstName" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="lastname" class="form-label">Last Name*</label>
                                                <input type="text" class="form-control" id="lastname" name="surname" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="address" class="form-label">Address</label>
                                                <input type="text" class="form-control" id="address" name="address">
                                            </div>
                                            <div class="row">
                                                <div class="col-md-4 mb-3">
                                                    <label for="plz" class="form-label">PLZ</label>
                                                    <input type="text" class="form-control" id="plz" name="plz">
                                                </div>
                                                <div class="col-md-4 mb-3">
                                                    <label for="zip" class="form-label">ZIP Code</label>
                                                    <input type="text" class="form-control" id="zip" name="postalCode">
                                                </div>
                                            </div>
                                            
                                        </div>
                                    </div>

                                    <div class="d-grid gap-2 mt-4">
                                        <button type="submit" class="btn btn-primary">Register</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="py-3 bg-light">
            <div class="container text-center">
                <p class="mb-0">&copy; 2025 Eventzone. All rights reserved.</p>
            </div>
        </footer>

        <script src="../js/register.js"></script>
        
        <script src="../js/auth.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                checkLoginStatus();
            });
        </script>
    </body>
</html>
