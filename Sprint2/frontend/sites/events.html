<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../res/img/tickets.ico">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Events - Eventzone</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="../res/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
</head>
<body class="min-vh-100 d-flex flex-column">
    <!-- Navigation will be included here -->
    <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #4f694d;">
        <div class="container">
            <!-- Logo and Brand/Welcome -->
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="../res/img/logo.png" alt="Logo" height="40" class="me-2">
                <span id="welcome-message" class="text-dark">Eventzone</span>
            </a>

            <!-- Mobile DropDown-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" 
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <button id="logout-btn" class="nav-link text-dark btn btn-link" 
                                onclick="logout()" style="display: none;">
                            Logout
                        </button>
                    </li>
                </ul>

                <!-- Search Form -->
                <form class="d-flex me-3">
                    <div class="input-group">
                        <input class="form-control" type="search" placeholder="Search..." aria-label="Search">
                        <button class="btn btn-outline-dark" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>

                <!-- Cart Icon -->
                <div class="d-flex align-items-center">
                    <a href="#" class="text-dark position-relative">
                        <img src="../res/img/cart.png" alt="Cart" height="30">
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            0
                            <span class="visually-hidden">items in cart</span>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <main class="flex-grow-1 py-5">
        <!-- Button to open modal -->
<button id="add-event-button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#createEventModal">
    + Add New Event
  </button>
  
  <!-- Modal with the event form -->
  <div class="modal fade" id="createEventModal" tabindex="-1" aria-labelledby="createEventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        
        <div class="modal-header">
          <h5 class="modal-title" id="createEventModalLabel">Create New Event</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
  
        <div class="modal-body">
            <form id="create-event-form" enctype="multipart/form-data">
            <input class="form-control mb-2" name="name" placeholder="Event name" required />
            <textarea class="form-control mb-2" name="description" placeholder="Description" required></textarea>
            <input class="form-control mb-2" name="date" type="date" required />
            <input class="form-control mb-2" name="price" type="number" step="0.01" placeholder="Price" required />
            <input class="form-control mb-2" name="images[]" type="file" multiple required />
            <input class="form-control mb-2" name="capacity" type="number" placeholder="Capacity" required />
            <select class="form-select mb-3" name="category" required>
              <option value="">Choose Category</option>
              <option value="concert">Concert</option>
              <option value="theatre">Theatre</option>
              <option value="sport">Sport</option>
              <option value="spotlight">Spotlight</option>
            </select>
            <button type="submit" class="btn btn-primary w-100">Create Event</button>
          </form>
          <div id="create-event-message" class="mt-3"></div>
        </div>
  
      </div>
    </div>
  </div>
        <div class="container mb-4">
            <div class="category-filters text-center">
                <button class="btn btn-outline-primary category-filter active" 
                        data-category="all" 
                        onclick="loadEvents()">
                    All Events
                </button>
                <button class="btn btn-outline-primary category-filter" 
                        data-category="concert" 
                        onclick="loadEvents('concert')">
                    Concerts
                </button>
                <button class="btn btn-outline-primary category-filter" 
                        data-category="theatre" 
                        onclick="loadEvents('theatre')">
                    Theatre
                </button>
                <button class="btn btn-outline-primary category-filter" 
                        data-category="sport" 
                        onclick="loadEvents('sport')">
                    Sports
                </button>
                <button class="btn btn-outline-primary category-filter" 
        data-category="spotlight" 
        onclick="loadEvents('spotlight')">
    Spotlight
</button>

            </div>
        </div>
        <div class="container event-grid">
            <div id="loading-spinner" class="text-center" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <div class="row">
                <!-- Events will be dynamically inserted here -->
            </div>
        </div>    
        
        <!-- Edit Event Modal -->
<div class="modal fade" id="editEventModal" tabindex="-1" aria-labelledby="editEventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        
        <div class="modal-header">
          <h5 class="modal-title" id="editEventModalLabel">Edit Event</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
  
        <div class="modal-body">
          <form id="edit-event-form">
            <input type="hidden" name="id">
            <input class="form-control mb-2" name="name" placeholder="Event name" required />
            <textarea class="form-control mb-2" name="description" placeholder="Description" required></textarea>
            <input class="form-control mb-2" name="date" type="date" required />
            <input class="form-control mb-2" name="price" type="number" step="0.01" placeholder="Price" required />
            <input class="form-control mb-2" name="images" placeholder="Image path(s)" required />
            <input class="form-control mb-2" name="capacity" type="number" placeholder="Capacity" required />
            <select class="form-select mb-3" name="category" required>
              <option value="concert">Concert</option>
              <option value="theatre">Theatre</option>
              <option value="sport">Sport</option>
              <option value="spotlight">Spotlight</option>
            </select>
            <button type="submit" class="btn btn-primary w-100">Update Event</button>
          </form>
          <div id="edit-event-message" class="mt-3"></div>
        </div>
  
      </div>
    </div>
  </div>
  
    </main>

    <footer class="py-3 bg-light mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 Eventzone. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/navControl.js"></script>
    <script src="../js/events.js"></script>
    
    <script>

        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            checkAuthorization();
            loadEvents();
        });
    </script>
</body>
</html>
