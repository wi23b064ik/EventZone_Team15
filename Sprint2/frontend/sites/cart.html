<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Eventzone</title>
    <link rel="shortcut icon" href="../res/img/tickets.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../res/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="min-vh-100 d-flex flex-column">
    <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #4f694d;">
        <div class="container">
            <!-- Logo and Brand/Welcome -->
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="../res/img/logo.png" alt="Logo" height="40" class="me-2">
                <span id="welcome-message" class="text-dark">Eventzone</span>
            </a>

            <!-- Mobile DropDown-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" 
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <button id="logout-btn" class="nav-link text-dark btn btn-link" 
                                onclick="logout()" style="display: none;">
                            Logout
                        </button>
                    </li>
                </ul>

                <!-- Search Form -->
                <form class="d-flex me-3">
                    <div class="input-group">
                        <input class="form-control" type="search" placeholder="Search..." aria-label="Search">
                        <button class="btn btn-outline-dark" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>

                <!-- Cart Icon -->
                <div class="d-flex align-items-center">
                    <a href="cart.html" class="text-dark position-relative">
                        <img src="../res/img/cart.png" alt="Cart" height="30">
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            0
                            <span class="visually-hidden">items in cart</span>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <h2 class="mb-4">Shopping Cart</h2>
            <div class="row">
                <div class="col-lg-8">
                    <!-- Cart Items -->
                    <div class="card mb-4">
                        <div class="card-body" id="cart-items">
                            <!-- Cart items will be dynamically inserted here -->
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <!-- Cart Summary -->
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Cart Summary</h5>
                            <div class="mb-3">
                                <input type="text" class="form-control" id="voucher-code" 
                                       placeholder="Enter voucher code">
                                <button class="btn btn-outline-primary mt-2" 
                                        onclick="applyVoucher()">Apply Voucher</button>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal:</span>
                                <span id="subtotal">€0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Discount:</span>
                                <span id="discount">-€0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <strong>Total:</strong>
                                <strong id="total">€0.00</strong>
                            </div>
                            <button class="btn btn-primary w-100" 
                                    onclick="checkout()">Proceed to Checkout</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/navControl.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
