<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../res/img/tickets.ico">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Eventzone - Home</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="../res/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="min-vh-100 d-flex flex-column">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #4f694d;">
        <div class="container">
            <!-- Logo and Brand/Welcome -->
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="../res/img/logo.png" alt="Logo" height="40" class="me-2">
                <span id="welcome-message" class="text-dark">Eventzone</span>
            </a>

            <!-- Mobile DropDown -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" 
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- ... existing nav items ... -->
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <button id="logout-btn" class="nav-link text-dark btn btn-link" 
                                onclick="logout()" style="display: none;">
                            Logout
                        </button>
                    </li>
                </ul>

                <!-- Search Form -->
                <form class="d-flex me-3">
                    <div class="input-group">
                        <input class="form-control" type="search" placeholder="Search..." aria-label="Search">
                        <button class="btn btn-outline-dark" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>

                <!-- Cart Icon -->
                <div class="d-flex align-items-center">
                    <a href="#" class="text-dark position-relative">
                        <img src="../res/img/cart.png" alt="Cart" height="30">
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            0
                            <span class="visually-hidden">items in cart</span>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <main class="container py-5" id="admin-section" style="display: none;">
        <h2>Manage Users</h2>
        <div id="user-message"></div>
        <table class="table table-bordered mt-3" id="user-table">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Name</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Users will be inserted here -->
            </tbody>
        </table>
    </main>
    
    </main>

    <footer class="py-3 bg-light">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 Eventzone. All rights reserved.</p>
        </div>
    </footer>
    <script src="../js/profile.js"></script>
    <script src="../js/navControl.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
